<!doctype html>
<!-- Mimics a typical series/film site: header, source tabs (Close / Rapid), a mid-sized player iframe, sidebar, ads. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock dizi sitesi</title>
<style>
body{margin:0;font-family:sans-serif;background:#222;color:#eee}
header{height:90px;background:#333}
.wrap{display:flex;gap:16px;padding:16px;transform:translateZ(0)}
main{flex:1}.side{width:260px;height:900px;background:#444}
.tabs button{margin:4px}
.player{position:relative;width:100%;max-width:820px;aspect-ratio:16/9;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ad{width:300px;height:250px;background:#a33}
.overlay{position:absolute;inset:0;z-index:5}
</style></head><body>
<header>LOGO · Diziler · Filmler</header>
<div class="wrap"><main>
  <div class="tabs"><button id="close">Close</button><button id="rapid">Rapid</button></div>
  <div class="player"><a class="overlay" href="#ad"></a></div>
  <iframe class="ad" src="about:blank"></iframe>
  <p>Bölüm açıklaması…</p>
</main><aside class="side"></aside></div>
<script>
// Player iframe arrives late, like real sites that inject it after the page loads.
function setSource(name){
  const p=document.querySelector('.player');
  p.querySelectorAll('iframe').forEach(f=>f.remove());
  const f=document.createElement('iframe');
  f.src='player.html?src='+name; f.allowFullscreen=true; f.setAttribute('allow','autoplay; fullscreen');
  p.appendChild(f);
}
document.getElementById('close').onclick=()=>setSource('close');
document.getElementById('rapid').onclick=()=>setSource('rapid');
setTimeout(()=>setSource('close'),700);
const q=new URLSearchParams(location.search);
// ?swap=1: the site swaps to the Rapid source while we are focused. ?off=1: focus gets turned off.
if(q.has('swap')) setTimeout(()=>setSource('rapid'),1800);
if(q.has('off')) setTimeout(()=>window.__floatPlayerFocus.set(false),1800);
</script></body></html>
